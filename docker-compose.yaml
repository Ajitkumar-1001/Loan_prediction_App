services:
  backend:
    build:
      context: .  # Root directory
      dockerfile: loan_api/Dockerfile
    container_name: smartloanpred-backend
    ports:
      - "8000:8000"
    volumes:
     - ./data:/app/loan_api/data  
     -  backend-logs:/app_logs
     - ./loan_api/ModelFiles:/app/loan_api/ModelFiles  
    working_dir: /app/loan_api 
    environment:
      - GOOGLE_API_KEY=${GEMINI_API_KEY}
    env_file:
      - .env
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile : Dockerfile
    container_name: smartloanpred-frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - app-network

  reverse-proxy:
    image: nginx:stable
    ports:
      - "80:80"
 
    depends_on:
      - backend
      - frontend
    networks:
      - app-network


networks:
  app-network:
    driver: bridge

volumes:
  backend-data:
  backend-logs:
